<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Perfil · Personal Assistant</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --ink: #1c2024; --muted: #6b7280;
    --line: #e3e6ea; --accent: #2f6fed; --accent-ink: #fff; --ok: #1a7f47;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --card: #1d2025; --ink: #e8eaed; --muted: #9aa1ab;
      --line: #2c3038; --accent: #4b86f0; --accent-ink: #0b0d10; --ok: #4ccb87;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    padding: 22px 20px; border-bottom: 1px solid var(--line);
    background: var(--card); position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  header h1 { font-size: 18px; margin: 0; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  main { max-width: 820px; margin: 0 auto; padding: 20px; }
  .grp {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px 18px; margin-bottom: 14px;
  }
  .grp > h2 { font-size: 15px; margin: 0 0 4px; }
  .grp > .hint { color: var(--muted); font-size: 12.5px; margin: 0 0 12px; }
  .opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
  label.opt {
    display: flex; gap: 9px; align-items: flex-start; padding: 8px 10px;
    border: 1px solid var(--line); border-radius: 9px; cursor: pointer;
  }
  label.opt:hover { border-color: var(--accent); }
  label.opt input { margin-top: 2px; accent-color: var(--accent); }
  label.opt span { font-size: 13.5px; }
  input[type=text] {
    width: 100%; padding: 9px 11px; border: 1px solid var(--line);
    border-radius: 9px; background: var(--bg); color: var(--ink); font: inherit;
  }
  .bar {
    position: sticky; bottom: 0; background: var(--card); border-top: 1px solid var(--line);
    padding: 12px 20px; display: flex; align-items: center; gap: 14px; justify-content: flex-end;
  }
  button {
    padding: 10px 20px; border: 0; border-radius: 9px; font: inherit; font-weight: 600;
    background: var(--accent); color: var(--accent-ink); cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  #msg { font-size: 13px; color: var(--ok); }
  #msg.err { color: #d33; }
  .loading { color: var(--muted); padding: 40px; text-align: center; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Perfil del asistente</h1>
    <p>Lo que elijas aquí guía las 4 automatizaciones. Se guarda en <code>config/user_profile.json</code>.</p>
  </div>
</header>
<main id="app"><div class="loading">Cargando…</div></main>
<div class="bar">
  <span id="msg"></span>
  <button id="save" disabled>Guardar</button>
</div>

<script>
const DIM_META = {
  formacion:                { title: "Formación",              hint: "Tu área de estudios. Alimenta las palabras clave de búsqueda de empleo." },
  sector_interes:           { title: "Sectores de interés",     hint: "Industrias que te interesan para trabajar." },
  objetivo_profesional:     { title: "Objetivo profesional",    hint: "Momento de carrera en el que estás." },
  intereses_rss:            { title: "Temas de noticias",       hint: "Definen el feed de Noticias y las fuentes de Marca Personal." },
  estilo_marca_personal:    { title: "Estilo de marca personal", hint: "Tono de los borradores de LinkedIn." },
  frecuencia_automatizacion:{ title: "Frecuencia",              hint: "Referencia informativa; el horario real está en cada workflow." },
  idioma:                   { title: "Idioma",                  hint: "Idioma de los resúmenes y borradores." },
};
const ORDER = ["idioma","intereses_rss","estilo_marca_personal","formacion","sector_interes","objetivo_profesional","frecuencia_automatizacion"];

let SINGLE = new Set();

function group(dim, options, selected) {
  const meta = DIM_META[dim] || { title: dim, hint: "" };
  const type = SINGLE.has(dim) ? "radio" : "checkbox";
  const opts = options.map(o => {
    const checked = selected.includes(o.id) ? "checked" : "";
    return `<label class="opt"><input type="${type}" name="${dim}" value="${o.id}" ${checked}><span>${o.nombre}</span></label>`;
  }).join("");
  return `<section class="grp"><h2>${meta.title}</h2><p class="hint">${meta.hint}</p><div class="opts">${opts}</div></section>`;
}

async function load() {
  const r = await fetch("api/data");
  const { modules, profile, single } = await r.json();
  SINGLE = new Set(single || []);
  const sel = profile.selections || {};

  const dims = ORDER.filter(d => modules[d]);
  let html = dims.map(d => group(d, modules[d], sel[d] || [])).join("");
  html += `<section class="grp"><h2>Ubicación laboral</h2><p class="hint">Ciudad o área para la búsqueda de empleo.</p>
           <input type="text" id="ubic" value="${(profile.ubicacion_laboral || "").replace(/"/g,'&quot;')}" placeholder="Barcelona"></section>`;
  document.getElementById("app").innerHTML = html;
  document.getElementById("save").disabled = false;
}

async function save() {
  const btn = document.getElementById("save"), msg = document.getElementById("msg");
  btn.disabled = true; msg.className = ""; msg.textContent = "Guardando…";
  const selections = {};
  document.querySelectorAll('#app input[type=checkbox], #app input[type=radio]').forEach(i => {
    if (!i.checked) return;
    (selections[i.name] = selections[i.name] || []).push(i.value);
  });
  const body = { selections, ubicacion_laboral: document.getElementById("ubic").value.trim() };
  try {
    const r = await fetch("api/profile", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || "error");
    msg.className = ""; msg.textContent = "Guardado ✓  ·  se aplica en la próxima ejecución de cada workflow";
  } catch (e) {
    msg.className = "err"; msg.textContent = "Error: " + e.message;
  } finally {
    btn.disabled = false;
  }
}

document.getElementById("save").addEventListener("click", save);
load().catch(e => { document.getElementById("app").innerHTML = '<div class="loading">Error cargando: ' + e.message + '</div>'; });
</script>
</body>
</html>
